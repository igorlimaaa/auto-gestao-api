server.port=${PORT:8080}

# springdoc: contract-first — a UI serve o YAML estático em openapi/, publicado
# em target/classes/static/openapi/ pelo maven-resources-plugin. Não gera a
# partir de anotações (api-docs.enabled=false).
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.url=/openapi/auto-gestao-api.yaml
springdoc.api-docs.enabled=false

# JACKSON CONFIGS
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=NON_NULL

# JPA / FLYWAY: o Flyway é o dono do schema (hibernate.ddl-auto=validate em
# todos os profiles). Schema próprio deste serviço no Postgres.
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:auto_gestao}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.schemas=${DB_SCHEMA:auto_gestao}

# ACTUATOR: só health público (ver SecurityConfig e management.endpoints).
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# SECURITY: JWT emitido pelo gestao-condial-oauth-service. issuer-uri é um
# placeholder até o oauth-service real estar no ar (ver CLAUDE.md).
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH_ISSUER_URI:http://localhost:8081}
