server.port=${PORT:8080}

# springdoc: contract-first — a UI serve o YAML estático em openapi/, publicado
# em target/classes/static/openapi/ pelo maven-resources-plugin. Não gera a
# partir de anotações (api-docs.enabled=false).
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.url=/openapi/auto-gestao-api.yaml
springdoc.api-docs.enabled=false

# JACKSON CONFIGS
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=NON_NULL

# JPA / FLYWAY: o Flyway é o dono do schema (hibernate.ddl-auto=validate em
# todos os profiles). Schema próprio deste serviço no Postgres.
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:auto_gestao}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.schemas=${DB_SCHEMA:auto_gestao}

# ACTUATOR: só health público (ver SecurityConfig e management.endpoints).
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# SECURITY: todo endpoint de domínio exige JWT válido emitido pelo
# gestao-condial-oauth-service (ver SecurityConfig).
#
# jwk-set-uri, e não apenas issuer-uri: com issuer-uri sozinho o Spring faz o
# OpenID Discovery (/.well-known/openid-configuration) na criação do bean, o que
# obriga o oauth-service a já estar no ar quando ESTE serviço sobe. Apontando
# direto para o JWK Set, as chaves são buscadas na primeira validação de token e
# ficam em cache. O issuer-uri continua configurado porque é ele que faz o
# Spring validar o claim "iss" — sem ele, um token assinado por outro emissor
# com a mesma chave passaria.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OAUTH_JWK_SET_URI:http://localhost:8081/oauth2/jwks}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH_ISSUER_URI:http://localhost:8081}

# Origens do gestao-condial-web autorizadas a chamar esta API direto do browser.
seguranca.cors.origens-permitidas=${CORS_ORIGENS:http://localhost:3000}

# LOCALE FIXO: as mensagens de bean validation seguem o Accept-Language do chamador, e o
# fetch do lado servidor do Next manda "Accept-Language: *" — o que resolvia para inglês e
# fazia a mesma validação responder em dois idiomas conforme quem chamasse. O sistema é
# pt-BR, então o idioma da resposta não é decisão do cliente.
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed
