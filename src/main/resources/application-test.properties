# DECISAO (item 6 do plano de modernizacao): mantido H2 em memoria para o
# profile de teste, em vez de migrar para Testcontainers+Postgres real.
# Motivo: flyway-core continua suportando H2 nativamente (nao existe modulo
# "flyway-database-h2" separado no Maven Central - H2 e um dos bancos com
# suporte embutido no core, ao lado do modulo dedicado flyway-database-postgresql
# usado para o Postgres real de dev/prod). A migration V1 usa apenas SQL
# ANSI-padrao (CREATE TABLE/IDENTITY/FK/tipos basicos), sem recursos
# especificos do Postgres, entao roda sem alteracao em H2 com MODE=PostgreSQL
# (compatibilidade de sintaxe). Testcontainers exigiria Docker rodando em todo
# ambiente de execucao dos testes (inclusive CI), o que nao e necessario dado
# que o schema atual e simples - fica documentado aqui como opcao a revisitar
# se migrations futuras usarem recursos Postgres-only (ex.: JSONB, arrays).

# datasource
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:auto-gestaotest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# jpa
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# Sobrescreve o "auto_gestao" do application.properties base: em H2 in-memory
# o schema padrão da conexão é PUBLIC, e deixar Flyway/Hibernate combinados
# nesse schema evita depender de folding de maiúsculas/minúsculas de
# identificador não citado entre H2 e Postgres (o schema "auto_gestao" real
# só existe no Postgres de dev/prod).
spring.jpa.properties.hibernate.default_schema=PUBLIC
spring.flyway.schemas=PUBLIC

# FLYWAY: inclui a location de seed (db/migration/dev) além do schema base.
spring.flyway.locations=classpath:db/migration,classpath:db/migration/dev

# SECURITY: SecurityConfig é @Profile("!test") — desligamos também o
# autoconfigure padrão do Spring Boot para não cair na segurança default
# (httpBasic/permitAll em tudo) nem tentar resolver o issuer-uri placeholder
# do OAuth2 Resource Server (que exigiria rede/HTTP no boot do contexto de
# teste). Nomes de classe pós-modularização do Spring Boot 4 (pacotes
# org.springframework.boot.security.* / org.springframework.boot.security.oauth2.*,
# diferentes dos pacotes org.springframework.boot.autoconfigure.security.* do
# Boot 3).
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.SecurityAutoConfiguration,org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration,org.springframework.boot.security.autoconfigure.web.servlet.ServletWebSecurityAutoConfiguration,org.springframework.boot.security.autoconfigure.actuate.web.servlet.ManagementWebSecurityAutoConfiguration,org.springframework.boot.security.oauth2.server.resource.autoconfigure.OAuth2ResourceServerAutoConfiguration,org.springframework.boot.security.oauth2.server.resource.autoconfigure.web.OAuth2ResourceServerWebSecurityAutoConfiguration

# JACKSON CONFIGS
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion = NON_NULL
