#DATASOURCE CONFIGS
spring.datasource.url = jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gestao_condial}
spring.datasource.username = ${DB_USER:postgres}
spring.datasource.password = ${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

#JPA CONFIGS
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.show_sql = false
spring.jpa.properties.hibernate.format_sql = true

#FLYWAY: só o schema base — sem seed de dados de desenvolvimento em prod (o seed vive em
# db/migration-dev, fora desta subárvore; ver application-dev.properties).
spring.flyway.locations=classpath:db/migration
# O bootstrap inicial rodou com o seed de dev ainda dentro de db/migration (antes da separação
# acima), então o histórico de prod tem uma versão aplicada cujo script não existe mais em
# nenhuma location que este profile varre. Sem isso o Flyway trava o boot achando que a
# migration sumiu; com o padrão abaixo, ele tolera esse caso específico e segue.
# (Boot 4 / Flyway 12: as flags booleanas antigas ignoreMissingMigrations etc. saíram do
# FlywayProperties — o mecanismo atual é ignore-migration-patterns.)
spring.flyway.ignore-migration-patterns=*:missing
