#DATASOURCE CONFIGS
# Base física compartilhada por todos os microsserviços (ver infra/README.md
# na pasta-mãe) — o que isola este serviço é DB_SCHEMA (auto_gestao), não DB_NAME.
spring.datasource.url = jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gestao_condial}
spring.datasource.username = ${DB_USER:postgres}
spring.datasource.password = ${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

#JPA CONFIGS
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.show_sql = true
spring.jpa.properties.hibernate.format_sql = true

#FLYWAY: inclui a location de seed (db/migration/dev) além do schema base.
spring.flyway.locations=classpath:db/migration,classpath:db/migration/dev

#SECURITY: em dev, desabilita completamente a segurança (autoconfiguração
# básica do Spring Boot + SecurityConfig ficam ambos desligados). OAuth é
# trabalho futuro — apenas o /docs/swagger-ui deve estar acessível em dev sem autenticação.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.SecurityAutoConfiguration,org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

#SWAGGER: habilita Swagger UI via springdoc-openapi (contract-first)
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/docs/
springdoc.api-docs.enabled=false
