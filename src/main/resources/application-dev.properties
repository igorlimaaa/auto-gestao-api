#DATASOURCE CONFIGS
# Base física compartilhada por todos os microsserviços (ver infra/README.md
# na pasta-mãe) — o que isola este serviço é DB_SCHEMA (auto_gestao), não DB_NAME.
spring.datasource.url = jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gestao_condial}
spring.datasource.username = ${DB_USER:postgres}
spring.datasource.password = ${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

#JPA CONFIGS
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.show_sql = true
spring.jpa.properties.hibernate.format_sql = true

#FLYWAY: inclui a location de seed além do schema base. O seed fica em db/migration-dev, e não
# em db/migration/dev: o Flyway varre cada location RECURSIVAMENTE, então uma subpasta de
# db/migration seria incluída em todo profile — inclusive test e prod — por mais que só dev a
# liste aqui.
spring.flyway.locations=classpath:db/migration,classpath:db/migration-dev

#SECURITY: dev usa a MESMA cadeia de segurança de prod (ver SecurityConfig) —
# JWT do gestao-condial-oauth-service obrigatório em todo endpoint de domínio,
# só /docs/** e /actuator/health abertos. Antes, dev era permitAll em tudo, o
# que fazia o comportamento de autenticação só aparecer em produção. Para
# exercitar a API localmente, pegue um token em POST http://localhost:8081/auth/login.

#SWAGGER: habilita Swagger UI via springdoc-openapi (contract-first)
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/docs/
springdoc.api-docs.enabled=false
