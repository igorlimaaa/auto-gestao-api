openapi: 3.0.3
info:
  title: auto-gestao-api
  description: >
    Backend do domínio de condomínio (Condomínio, Endereço, Pessoa, Taxa Extra,
    Meio de Contato) do ecossistema Gestão Condial. Contrato contract-first:
    este arquivo é a fonte da verdade dos endpoints; as interfaces de
    controller e os modelos são gerados a partir dele pelo
    openapi-generator-maven-plugin.
  version: "1.0.0"
servers:
  - url: /
tags:
  - name: Condominio
    description: Operações sobre condomínios e suas taxas extras.
  - name: Endereco
    description: Operações sobre endereços.
  - name: Pessoa
    description: Operações sobre pessoas (moradores) e seus meios de contato.
  - name: Unidade
    description: >
      Operações sobre unidades autônomas (apartamento, sala, loja). Uma unidade existe por si
      só: pode ser cadastrada vazia, e o morador é ligado a ela depois — ou nunca.
  - name: CobrancaOrdinaria
    description: >
      Controle mensal de cobrança da taxa ordinária, por unidade — nunca por morador, para que
      a troca de morador não afete o histórico de pagamento. O Banco Inter é a única origem: os
      registros nascem da importação das cobranças que ele emite (job de hora em hora, ou
      `POST /cobrancaOrdinaria/sincronizar`) — não há criação avulsa nem exclusão manual.
  - name: AreaComum
    description: >
      Catálogo das áreas comuns do condomínio (salão de festas, churrasqueira, piscina...). É o
      síndico quem cadastra; o morador só escolhe entre as áreas reserváveis e ativas — nunca digita
      uma área livre. Cada área carrega as próprias regras de uso (horário, capacidade).
  - name: Evento
    description: >
      Agenda do condomínio: reuniões, reservas de áreas comuns, eventos sociais e manutenções.
      Qualquer perfil cadastra. Evento cadastrado por **morador** nasce `PENDENTE` e só aparece para
      os demais quando o síndico/administrador (permissão `EVENTO_APROVAR`) o aprova; os cadastrados
      pelos outros perfis já nascem `APROVADO`. Reserva de área e manutenção de área não podem
      se sobrepor a outro evento aprovado da mesma área.
  - name: SaldoBancario
    description: >
      Saldo da conta-corrente do condomínio no Banco Inter (somente leitura). Dado financeiro
      sensível: exige a permissão `SALDO_LER`, concedida só ao síndico.
paths:
  /condominio:
    get:
      tags: [Condominio]
      operationId: listCondominios
      summary: Lista todos os condomínios cadastrados.
      responses:
        "200":
          description: Lista de condomínios.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Condominio"
    post:
      tags: [Condominio]
      operationId: createCondominio
      summary: Cria um novo condomínio.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Condominio"
      responses:
        "201":
          description: Condomínio criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Condominio"
        "400":
          description: Erro de validação dos parâmetros enviados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaDeErros"
        "404":
          description: Endereço informado não encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaDeErros"
  /condominio/{idCondominio}:
    get:
      tags: [Condominio]
      operationId: findCondominio
      summary: Busca um condomínio pelo id.
      parameters:
        - name: idCondominio
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Condomínio encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Condominio"
    put:
      tags: [Condominio]
      operationId: updateCondominio
      summary: Atualiza um condomínio.
      description: Exige a permissão `CONDOMINIO_ESCREVER`.
      parameters:
        - name: idCondominio
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Condominio"
      responses:
        "200":
          description: Condomínio atualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Condominio"
        "400":
          $ref: "#/components/responses/DadosInvalidos"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
    delete:
      tags: [Condominio]
      operationId: deleteCondominio
      summary: Exclui um condomínio.
      description: >
        Exige a permissão `CONDOMINIO_ESCREVER`. Recusa com 409 se ainda houver unidades,
        moradores ou taxas vinculados — apagar em cascata levaria junto o cadastro de gente que
        mora lá.
      parameters:
        - name: idCondominio
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Condomínio excluído.
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          $ref: "#/components/responses/EmUso"
  /condominio/taxaExtra:
    get:
      tags: [Condominio]
      operationId: listTaxasExtras
      summary: Lista as taxas extras.
      description: Exige a permissão `TAXA_LER`.
      parameters:
        - name: idCondominio
          in: query
          description: Restringe a um condomínio.
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Taxas extras.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaxaExtra"
    post:
      tags: [Condominio]
      operationId: createTaxaExtra
      summary: Cria uma taxa extra para um condomínio.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaxaExtra"
      responses:
        "201":
          description: Taxa extra criada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxaExtra"
        "400":
          description: Erro de validação dos parâmetros enviados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaDeErros"
  /condominio/taxaExtra/{idTaxaExtra}:
    put:
      tags: [Condominio]
      operationId: updateTaxaExtra
      summary: Atualiza uma taxa extra.
      description: Exige a permissão `TAXA_ESCREVER`.
      parameters:
        - name: idTaxaExtra
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaxaExtra"
      responses:
        "200":
          description: Taxa atualizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxaExtra"
        "400":
          $ref: "#/components/responses/DadosInvalidos"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
    delete:
      tags: [Condominio]
      operationId: deleteTaxaExtra
      summary: Exclui uma taxa extra.
      description: >
        Exige a permissão `TAXA_ESCREVER`. Se for a última taxa do condomínio, o indicador
        `possuiTaxaExtra` volta para falso — do contrário o condomínio ficaria marcado como
        tendo taxa extra sem ter nenhuma.
      parameters:
        - name: idTaxaExtra
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Taxa excluída.
        "404":
          $ref: "#/components/responses/NaoEncontrado"
  /condominio/taxaExtraPorCondominio/{idCondominio}:
    get:
      tags: [Condominio]
      operationId: findTaxaExtraCondominio
      summary: Lista as taxas extras de um condomínio.
      parameters:
        - name: idCondominio
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Lista de taxas extras do condomínio.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaxaExtra"
  /endereco:
    get:
      tags: [Endereco]
      operationId: findEndereco
      summary: Lista todos os endereços cadastrados.
      responses:
        "200":
          description: Lista de endereços.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Endereco"
    post:
      tags: [Endereco]
      operationId: saveEndereco
      summary: Cria um novo endereço.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Endereco"
      responses:
        "201":
          description: Endereço criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Endereco"
        "400":
          description: Erro de validação dos parâmetros enviados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaDeErros"
  /pessoa:
    get:
      tags: [Pessoa]
      operationId: findAll
      parameters:
        - name: idCondominio
          in: query
          description: Restringe a um condomínio.
          schema:
            type: integer
            format: int64
        - name: idUnidade
          in: query
          description: Restringe a uma unidade.
          schema:
            type: integer
            format: int64
        - name: semUnidade
          in: query
          description: Quando verdadeiro, traz só os moradores ainda não vinculados a uma unidade.
          schema:
            type: boolean
        - name: busca
          in: query
          description: Texto livre; casa com nome e CPF.
          schema:
            type: string
      summary: Lista todas as pessoas cadastradas.
      responses:
        "200":
          description: Lista de pessoas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pessoa"
    post:
      tags: [Pessoa]
      operationId: savePessoa
      summary: Cria uma nova pessoa.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Pessoa"
      responses:
        "201":
          description: Pessoa criada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pessoa"
        "400":
          description: Erro de validação dos parâmetros enviados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaDeErros"
  /pessoa/{idPessoa}:
    get:
      tags: [Pessoa]
      operationId: findPessoaId
      summary: Busca uma pessoa pelo id.
      parameters:
        - name: idPessoa
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Pessoa encontrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pessoa"
    put:
      tags: [Pessoa]
      operationId: updatePessoa
      summary: Atualiza um morador.
      description: >
        Exige a permissão `MORADOR_ESCREVER`. Para desvincular o morador da unidade, envie
        `unidade` nulo.
      parameters:
        - name: idPessoa
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Pessoa"
      responses:
        "200":
          description: Morador atualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pessoa"
        "400":
          $ref: "#/components/responses/DadosInvalidos"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
    delete:
      tags: [Pessoa]
      operationId: deletePessoa
      summary: Exclui um morador.
      description: Exige a permissão `MORADOR_ESCREVER`. Os meios de contato dele vão junto.
      parameters:
        - name: idPessoa
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Morador excluído.
        "404":
          $ref: "#/components/responses/NaoEncontrado"
  /pessoa/findEnvioPorEmailPorCondominio/{id}:
    get:
      tags: [Pessoa]
      operationId: findEnvioPorEmailPorCondominio
      summary: Lista as pessoas de um condomínio que recebem taxa por e-mail.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Lista de pessoas com envio de taxa por e-mail habilitado.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pessoa"
  /pessoa/listPessoasCondominio/{idCondominio}:
    get:
      tags: [Pessoa]
      operationId: findPessoasCondominio
      summary: Lista as pessoas de um condomínio.
      parameters:
        - name: idCondominio
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Lista de pessoas do condomínio.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pessoa"
  /pessoa/meioContatoPessoa:
    post:
      tags: [Pessoa]
      operationId: saveMeioContato
      summary: Cria um meio de contato para uma pessoa.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeioContato"
      responses:
        "201":
          description: Meio de contato criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeioContato"
        "400":
          description: Erro de validação dos parâmetros enviados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaDeErros"
  /unidade:
    get:
      tags: [Unidade]
      operationId: listUnidades
      summary: Lista as unidades.
      description: Exige a permissão `UNIDADE_LER`.
      parameters:
        - name: idCondominio
          in: query
          description: Restringe a um condomínio.
          schema:
            type: integer
            format: int64
        - name: ativa
          in: query
          schema:
            type: boolean
        - name: busca
          in: query
          description: Texto livre; casa com bloco e número.
          schema:
            type: string
      responses:
        "200":
          description: Unidades encontradas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Unidade"
    post:
      tags: [Unidade]
      operationId: createUnidade
      summary: Cadastra uma unidade.
      description: >
        Exige a permissão `UNIDADE_ESCREVER`. A unidade nasce sem morador — vincular alguém é um
        passo separado, feito pelo cadastro do morador.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Unidade"
      responses:
        "201":
          description: Unidade criada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unidade"
        "400":
          $ref: "#/components/responses/DadosInvalidos"
        "409":
          description: Já existe uma unidade com esse bloco e número no condomínio.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaDeErros"
  /unidade/{idUnidade}:
    get:
      tags: [Unidade]
      operationId: findUnidade
      summary: Busca uma unidade pelo id.
      description: Exige a permissão `UNIDADE_LER`.
      parameters:
        - name: idUnidade
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Unidade encontrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unidade"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
    put:
      tags: [Unidade]
      operationId: updateUnidade
      summary: Atualiza uma unidade.
      description: Exige a permissão `UNIDADE_ESCREVER`.
      parameters:
        - name: idUnidade
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Unidade"
      responses:
        "200":
          description: Unidade atualizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unidade"
        "400":
          $ref: "#/components/responses/DadosInvalidos"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          description: Já existe outra unidade com esse bloco e número no condomínio.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaDeErros"
    delete:
      tags: [Unidade]
      operationId: deleteUnidade
      summary: Exclui uma unidade.
      description: >
        Exige a permissão `UNIDADE_ESCREVER`. Recusa com 409 se houver morador vinculado —
        desvincule antes, para que a remoção seja uma decisão explícita e não um efeito colateral.
      parameters:
        - name: idUnidade
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Unidade excluída.
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          $ref: "#/components/responses/EmUso"
  /cobrancaOrdinaria:
    get:
      tags: [CobrancaOrdinaria]
      operationId: listCobrancasOrdinarias
      summary: Lista as cobranças da taxa ordinária.
      description: >
        Exige a permissão `COBRANCA_LER`. Todos os filtros são opcionais e combináveis.
      parameters:
        - name: idCondominio
          in: query
          description: Restringe a um condomínio.
          schema:
            type: integer
            format: int64
        - name: idUnidade
          in: query
          description: Restringe a uma unidade.
          schema:
            type: integer
            format: int64
        - name: competencia
          in: query
          description: Restringe a uma competência (sempre o dia 1 do mês, ex. "2026-05-01").
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Cobranças encontradas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CobrancaOrdinaria"
  /cobrancaOrdinaria/{idCobrancaOrdinaria}:
    get:
      tags: [CobrancaOrdinaria]
      operationId: findCobrancaOrdinaria
      summary: Busca uma cobrança da taxa ordinária pelo id.
      description: Exige a permissão `COBRANCA_LER`.
      parameters:
        - name: idCobrancaOrdinaria
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Cobrança encontrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CobrancaOrdinaria"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
    patch:
      tags: [CobrancaOrdinaria]
      operationId: updateDadosDePagamentoCobrancaOrdinaria
      summary: Atualiza o PIX copia-e-cola e a linha digitável do boleto da cobrança.
      description: >
        Exige a permissão `COBRANCA_ESCREVER`. Preenchidos manualmente pelo administrador
        enquanto não existir integração automática de pagamento.
      parameters:
        - name: idCobrancaOrdinaria
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DadosDePagamentoCobranca"
      responses:
        "200":
          description: Dados de pagamento atualizados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CobrancaOrdinaria"
        "400":
          $ref: "#/components/responses/DadosInvalidos"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
  /cobrancaOrdinaria/pendencias-do-banco:
    get:
      tags: [CobrancaOrdinaria]
      operationId: listPendenciasDoBanco
      summary: Cobranças do banco que não viraram cobrança no sistema.
      description: >
        Exige a permissão `COBRANCA_LER`. O banco é a única origem das cobranças; quando a
        importação não consegue ligar uma cobrança dele a uma unidade (ou a regra não deixa
        criá-la), ela aparece aqui em vez de sumir em silêncio. É o retrato da última importação.

        Só administrador e síndico as veem; os demais perfis recebem lista vazia.
      parameters:
        - name: idCondominio
          in: query
          description: Restringe a um condomínio.
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Pendências encontradas (lista vazia quando não há nenhuma).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CobrancaBancoPendente"
  /cobrancaOrdinaria/sincronizar:
    post:
      tags: [CobrancaOrdinaria]
      operationId: sincronizarCobrancasOrdinarias
      summary: Dispara manualmente a sincronização com o Banco Inter.
      description: >
        Exige o papel `ADMINISTRADOR` e a permissão `COBRANCA_ESCREVER`. Importa as cobranças emitidas no banco (janela de
        30 dias atrás a 60 dias à frente, por vencimento) e confere a situação das ainda não
        pagas — a mesma lógica dos jobs agendados. O banco só é consultado (GET); nada é emitido
        nem alterado lá. Condomínios sem credenciais do banco configuradas são ignorados.

        Sem `idCondominio`, um perfil com escopo roda só para o próprio condomínio; um perfil
        global roda para todos. Pedir um condomínio fora do escopo responde 403.
      parameters:
        - name: idCondominio
          in: query
          description: Restringe a sincronização a um único condomínio.
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Sincronização concluída.
        "404":
          $ref: "#/components/responses/NaoEncontrado"
  /cobrancaOrdinaria/{idCobrancaOrdinaria}/pdf:
    get:
      tags: [CobrancaOrdinaria]
      operationId: obterPdfCobrancaOrdinaria
      summary: Boleto da cobrança em PDF.
      description: >
        Exige a permissão `COBRANCA_LER`. Busca o PDF no Banco Inter **a cada chamada** — nada é
        guardado. Só para cobranças vindas do banco e ainda em aberto (nem pagas, nem canceladas).

        O PDF traz nome, CPF e endereço do pagador, então administrador e síndico abrem o de
        qualquer unidade do alcance deles; os demais perfis, só o da própria unidade (achada pelo
        e-mail do login no cadastro de moradores). Fora disso, 403.
      parameters:
        - name: idCobrancaOrdinaria
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: O boleto, para exibir (inline) ou baixar.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "403":
          description: O perfil não alcança esta cobrança ou esta unidade.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaDeErros"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          description: A cobrança não tem boleto a mostrar (sem vínculo com o banco, paga ou cancelada).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaDeErros"
        "502":
          description: O Banco Inter não respondeu. Tentar de novo em instantes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaDeErros"
  /cobrancaOrdinaria/{idCobrancaOrdinaria}/pagamento:
    post:
      tags: [CobrancaOrdinaria]
      operationId: registrarPagamentoCobrancaOrdinaria
      summary: Registra o pagamento da cobrança.
      description: >
        Exige a permissão `COBRANCA_ESCREVER`. A unidade passa a constar EM DIA. Sem
        `dataPagamento` no corpo, vale a data de hoje.
      parameters:
        - name: idCobrancaOrdinaria
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistroDePagamento"
      responses:
        "200":
          description: Pagamento registrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CobrancaOrdinaria"
        "400":
          $ref: "#/components/responses/DadosInvalidos"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
  /areaComum:
    get:
      tags: [AreaComum]
      operationId: listAreasComuns
      summary: Lista as áreas comuns.
      description: Exige a permissão `AREA_LER`. O recorte por condomínio vem do perfil ativo.
      parameters:
        - name: idCondominio
          in: query
          description: Restringe a um condomínio.
          schema:
            type: integer
            format: int64
        - name: ativa
          in: query
          schema:
            type: boolean
        - name: reservavel
          in: query
          description: Só as áreas que podem receber reservas.
          schema:
            type: boolean
      responses:
        "200":
          description: Áreas encontradas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AreaComum"
    post:
      tags: [AreaComum]
      operationId: createAreaComum
      summary: Cadastra uma área comum.
      description: Exige a permissão `AREA_ESCREVER`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AreaComum"
      responses:
        "201":
          description: Área criada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaComum"
        "400":
          $ref: "#/components/responses/DadosInvalidos"
        "409":
          description: O condomínio já tem uma área com esse nome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaDeErros"
  /areaComum/{idAreaComum}:
    put:
      tags: [AreaComum]
      operationId: updateAreaComum
      summary: Atualiza uma área comum.
      description: Exige a permissão `AREA_ESCREVER`.
      parameters:
        - name: idAreaComum
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AreaComum"
      responses:
        "200":
          description: Área atualizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaComum"
        "400":
          $ref: "#/components/responses/DadosInvalidos"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          description: Já existe outra área com esse nome no condomínio.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaDeErros"
    delete:
      tags: [AreaComum]
      operationId: deleteAreaComum
      summary: Exclui uma área comum.
      description: >
        Exige a permissão `AREA_ESCREVER`. Recusa com 409 se houver evento ligado à área — nesse
        caso o caminho é desativá-la (`ativa = false`), que a tira das opções sem apagar o histórico.
      parameters:
        - name: idAreaComum
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Área excluída.
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          $ref: "#/components/responses/EmUso"
  /evento:
    get:
      tags: [Evento]
      operationId: listEventos
      summary: Lista os eventos de um período.
      description: >
        Exige a permissão `EVENTO_LER`. Quem não tem `EVENTO_APROVAR` recebe os eventos aprovados e,
        além deles, os que ele mesmo cadastrou em qualquer situação (para acompanhar o pedido).
        Nos eventos de outras pessoas, nome e e-mail do solicitante não são entregues.
      parameters:
        - name: idCondominio
          in: query
          description: Restringe a um condomínio.
          schema:
            type: integer
            format: int64
        - name: inicio
          in: query
          description: Primeiro dia do período (inclusive).
          schema:
            type: string
            format: date
        - name: fim
          in: query
          description: Último dia do período (exclusive) — a mesma convenção do calendário.
          schema:
            type: string
            format: date
        - name: situacao
          in: query
          schema:
            type: string
            enum: [PENDENTE, APROVADO, RECUSADO, CANCELADO]
      responses:
        "200":
          description: Eventos do período.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Evento"
    post:
      tags: [Evento]
      operationId: createEvento
      summary: Cadastra um evento.
      description: >
        Exige a permissão `EVENTO_ESCREVER`. Nasce `PENDENTE` quando quem cadastra é morador, e
        `APROVADO` nos demais casos. Reserva de área exige uma área reservável e ativa, dentro do
        horário dela e sem sobrepor outro evento aprovado (409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Evento"
      responses:
        "201":
          description: Evento criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evento"
        "400":
          $ref: "#/components/responses/DadosInvalidos"
        "409":
          description: A área já está ocupada nesse horário.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaDeErros"
  /evento/{idEvento}:
    get:
      tags: [Evento]
      operationId: findEvento
      summary: Busca um evento pelo id.
      description: Exige a permissão `EVENTO_LER`, com a mesma visibilidade da listagem.
      parameters:
        - name: idEvento
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Evento encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evento"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
    put:
      tags: [Evento]
      operationId: updateEvento
      summary: Altera um evento.
      description: >
        Exige a permissão `EVENTO_ESCREVER`. Quem tem `EVENTO_APROVAR` altera qualquer evento em
        aberto ou aprovado; os demais, só os próprios e enquanto `PENDENTE`.
      parameters:
        - name: idEvento
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Evento"
      responses:
        "200":
          description: Evento alterado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evento"
        "400":
          $ref: "#/components/responses/DadosInvalidos"
        "403":
          description: O perfil não pode alterar este evento.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaDeErros"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          description: Conflito de horário na área, ou situação do evento não permite alterar.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaDeErros"
  /evento/{idEvento}/decisao:
    post:
      tags: [Evento]
      operationId: decidirEvento
      summary: Aprova ou recusa um evento pendente.
      description: >
        Exige a permissão `EVENTO_APROVAR`. Recusar exige o motivo. Aprovar confere de novo o
        conflito de horário na área — outro evento pode ter sido aprovado nesse meio tempo (409).
      parameters:
        - name: idEvento
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisaoDeEvento"
      responses:
        "200":
          description: Decisão registrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evento"
        "400":
          $ref: "#/components/responses/DadosInvalidos"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          description: O evento não está pendente, ou a área já está ocupada nesse horário.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaDeErros"
  /evento/{idEvento}/cancelamento:
    post:
      tags: [Evento]
      operationId: cancelarEvento
      summary: Cancela um evento.
      description: >
        Exige a permissão `EVENTO_ESCREVER`. Quem cadastrou cancela o próprio pedido; quem tem
        `EVENTO_APROVAR` cancela qualquer um. O evento fica `CANCELADO` (o histórico é mantido) e
        libera o horário da área.
      parameters:
        - name: idEvento
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Evento cancelado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evento"
        "403":
          description: O perfil não pode cancelar este evento.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaDeErros"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          description: O evento já está recusado ou cancelado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaDeErros"
  /saldoBancario:
    get:
      tags: [SaldoBancario]
      operationId: findSaldoBancario
      summary: Consulta o saldo da conta-corrente do condomínio.
      description: >
        Exige a permissão `SALDO_LER`. Consulta o Banco Inter (`GET /banking/v2/saldo`); a resposta
        fica em cache por um minuto e nunca é guardada pelo navegador (`Cache-Control: no-store`).
        409 se o condomínio não tem conta do Inter configurada; 502 se o banco falhar.
      parameters:
        - name: idCondominio
          in: query
          description: Omitido, vale o condomínio do perfil ativo.
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Saldo da conta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaldoBancario"
        "400":
          $ref: "#/components/responses/DadosInvalidos"
        "409":
          description: O condomínio não tem a conta do Banco Inter configurada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaDeErros"
        "502":
          description: Não foi possível consultar o banco.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaDeErros"
components:
  responses:
    DadosInvalidos:
      description: Dados inválidos.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ListaDeErros"
    NaoEncontrado:
      description: Recurso não encontrado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ListaDeErros"
    EmUso:
      description: O recurso ainda está vinculado a outros registros.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ListaDeErros"
  schemas:
    SaldoBancario:
      type: object
      required: [idCondominio, disponivel, bloqueado, consultadoEm]
      properties:
        idCondominio:
          type: integer
          format: int64
        disponivel:
          type: number
          format: double
          description: Quanto pode ser movimentado agora.
        bloqueado:
          type: number
          format: double
          description: Soma dos bloqueios (cheque, judicial e administrativo).
        limite:
          type: number
          format: double
          description: Limite da conta.
        consultadoEm:
          type: string
          format: date-time
          description: Quando o banco foi consultado — o saldo vale para esse instante.
    AreaComum:
      type: object
      description: >
        Área comum do condomínio. O horário de funcionamento vale para as reservas: sem ele, a área
        pode ser reservada a qualquer hora.
      required: [nome]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        idCondominio:
          type: integer
          format: int64
          description: Condomínio da área. Omitido, vale o do perfil ativo.
        nome:
          type: string
          maxLength: 60
          description: Nome único dentro do condomínio — "Salão de festas".
        descricao:
          type: string
          maxLength: 300
        reservavel:
          type: boolean
          default: false
          description: Verdadeiro se os moradores podem reservar a área. Elevador e hall, por exemplo, não.
        capacidade:
          type: integer
          format: int32
          minimum: 1
          description: Quantas pessoas a área comporta.
        horaAbertura:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: "08:00"
        horaFechamento:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: "22:00"
        ativa:
          type: boolean
          default: true
          description: Área inativa some das opções, mas o histórico de eventos continua.
    DecisaoDeEvento:
      type: object
      required: [aprovar]
      properties:
        aprovar:
          type: boolean
        motivo:
          type: string
          maxLength: 300
          description: Obrigatório ao recusar.
    Evento:
      type: object
      required: [tipo, titulo, inicio, fim]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        idCondominio:
          type: integer
          format: int64
          description: Omitido, vale o condomínio do perfil ativo.
        idAreaComum:
          type: integer
          format: int64
          description: >
            Obrigatório em `RESERVA_AREA`; opcional nos demais (por exemplo, manutenção da piscina).
        nomeDaAreaComum:
          type: string
          readOnly: true
        tipo:
          type: string
          enum: [REUNIAO, RESERVA_AREA, SOCIAL, MANUTENCAO, OUTRO]
        titulo:
          type: string
          maxLength: 100
        descricao:
          type: string
          maxLength: 500
        inicio:
          type: string
          format: date-time
        fim:
          type: string
          format: date-time
          description: Exclusivo — a convenção do calendário. Em dia inteiro, é a meia-noite do dia seguinte.
        diaInteiro:
          type: boolean
          default: false
        situacao:
          type: string
          readOnly: true
          enum: [PENDENTE, APROVADO, RECUSADO, CANCELADO]
        idUnidade:
          type: integer
          format: int64
          readOnly: true
          description: Unidade de quem cadastrou, quando é morador.
        rotuloDaUnidade:
          type: string
          readOnly: true
        solicitanteNome:
          type: string
          readOnly: true
          description: Só para quem cadastrou e para quem aprova.
        solicitanteEmail:
          type: string
          readOnly: true
          description: Só para quem cadastrou e para quem aprova.
        motivoDaDecisao:
          type: string
          readOnly: true
        dataDaDecisao:
          type: string
          format: date-time
          readOnly: true
        ehMeu:
          type: boolean
          readOnly: true
          description: O perfil da requisição foi quem cadastrou o evento.
        podeEditar:
          type: boolean
          readOnly: true
        podeCancelar:
          type: boolean
          readOnly: true
        podeDecidir:
          type: boolean
          readOnly: true
    Unidade:
      type: object
      description: >
        Unidade autônoma de um condomínio. Existe independentemente de haver morador: o vínculo
        com uma Pessoa é opcional nos dois sentidos.

        Sem `required` de propósito: este mesmo schema aparece aninhado em `Pessoa.unidade`,
        onde serve só para referenciar a unidade pelo `id`. Exigir `numero` e `condominio` aqui
        rejeitaria `{"unidade": {"id": 7}}` na hora de vincular um morador. A obrigatoriedade
        vale na criação da unidade e é aplicada no `UnidadeDto`.
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        condominio:
          $ref: "#/components/schemas/Condominio"
        bloco:
          type: string
          maxLength: 30
          description: Opcional — condomínios de bloco único não usam.
        numero:
          type: string
          maxLength: 20
          description: Identificação da unidade. Texto, não número — "101", "A-3" e "Loja 2" valem.
        andar:
          type: integer
          format: int32
        fracaoIdeal:
          type: number
          format: double
          readOnly: true
          description: >
            Participação da unidade no rateio das despesas, calculada pelo servidor como
            1 / `quantidadeUnidades` do condomínio (6 casas). Ausente enquanto o condomínio não
            informar a quantidade de unidades. Valor enviado pelo cliente é ignorado.
        observacao:
          type: string
          maxLength: 300
        percentualDescontoTaxa:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: >
            Desconto sobre a taxa ordinária, de 0 a 100. `100` isenta a unidade: cobrança que o banco
            emitir para ela é ignorada (e listada em `pendencias-do-banco`). Abaixo de 100 é só
            informativo — o valor cobrado é o que o banco emite. Ausente mantém o valor atual.
        motivoDescontoTaxa:
          type: string
          maxLength: 100
          description: Por que a unidade tem desconto — ex. "Unidade do síndico".
        ativa:
          type: boolean
          default: true
        quantidadeDeMoradores:
          type: integer
          format: int32
          readOnly: true
          description: Quantos moradores estão vinculados. Zero é condição para poder excluir.

    Condominio:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        ddd:
          type: integer
          format: int32
        numeroTelefone:
          type: integer
          format: int64
        endereco:
          $ref: "#/components/schemas/Endereco"
        valorJuros:
          type: number
          format: double
        valorMulta:
          type: number
          format: double
        possuiTaxaExtra:
          type: boolean
          default: false
        valorTaxaCondominial:
          type: number
          format: double
        diaVencimentoTaxaOrdinaria:
          type: integer
          format: int32
          minimum: 1
          maximum: 31
          description: >
            Dia do mês em que a taxa ordinária vence. Base para a geração mensal das cobranças
            (ver `CobrancaOrdinaria`) e para marcar uma unidade como inadimplente.
        quantidadeUnidades:
          type: integer
          format: int32
          minimum: 1
          description: >
            Total de unidades do condomínio. Base da `fracaoIdeal` de cada unidade (1 / quantidade).
        valorTaxasExtras:
          type: number
          format: double
          readOnly: true
          description: Somatório das taxas extras vigentes, calculado pelo servidor.
        valorTotalPorUnidade:
          type: number
          format: double
          readOnly: true
          description: Valor final por unidade (taxa condominial + taxas extras), calculado pelo servidor.
    Endereco:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        cep:
          type: integer
          format: int64
        endereco:
          type: string
        complemento:
          type: string
    Pessoa:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        nomeCompleto:
          type: string
        unidade:
          allOf:
            - $ref: "#/components/schemas/Unidade"
          description: >
            Unidade onde a pessoa mora. Nulo é válido — um morador pode ser cadastrado antes de
            se saber onde vai morar. Para vincular, basta enviar o objeto com o `id`.
        envioTaxaEmail:
          type: boolean
        email:
          type: string
          format: email
          description: >
            E-mail para onde as taxas e cobranças são enviadas quando `envioTaxaEmail` é
            verdadeiro.
        envioImpresso:
          type: boolean
        isSindico:
          type: boolean
        condominio:
          $ref: "#/components/schemas/Condominio"
        endereco:
          $ref: "#/components/schemas/Endereco"
        cpf:
          type: string
          description: CPF da pessoa (validado no servidor).
    MeioContato:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        pessoa:
          $ref: "#/components/schemas/Pessoa"
        tipoMeioContato:
          type: string
          enum:
            - EMAIL
            - TELEF
        identificacao:
          type: string
    TaxaExtra:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        condominio:
          $ref: "#/components/schemas/Condominio"
        valorTaxaExtra:
          type: number
          format: double
        numeroParcelas:
          type: integer
          format: int32
        descricaoTaxa:
          type: string
        dataCadastro:
          type: string
          format: date-time
    CobrancaOrdinaria:
      type: object
      description: >
        Registro mensal de cobrança da taxa ordinária de uma unidade. Nasce da importação do Banco
        Inter (ver a descrição da tag `CobrancaOrdinaria`) — não há endpoint de criação nem exclusão.
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        unidade:
          $ref: "#/components/schemas/Unidade"
        competencia:
          type: string
          format: date
          readOnly: true
          description: Sempre o dia 1 do mês a que a cobrança se refere.
        dataVencimento:
          type: string
          format: date
          readOnly: true
        valor:
          type: number
          format: double
          readOnly: true
          description: Snapshot da taxa condominial no momento da geração. Não inclui taxas extras.
        pixCopiaCola:
          type: string
          description: Vem do Banco Inter; só é preenchido à mão em cobranças que não vieram de lá.
        linhaDigitavel:
          type: string
          description: Linha digitável do boleto. Vem do Banco Inter; só é preenchida à mão em cobranças que não vieram de lá.
        dataPagamento:
          type: string
          format: date
        codigoBarras:
          type: string
          readOnly: true
          description: Código de barras do boleto, vindo do Banco Inter.
        valorTotalRecebido:
          type: number
          format: double
          readOnly: true
          description: Valor efetivamente recebido, informado pelo banco (pode incluir multa e juros).
        origemRecebimento:
          type: string
          readOnly: true
          description: Como foi pago, segundo o banco — `PIX` ou `BOLETO`.
        codigoSolicitacao:
          type: string
          readOnly: true
          description: Id da cobrança no Banco Inter. Ausente em cobranças que não vieram do banco.
        podeVerBoleto:
          type: boolean
          readOnly: true
          description: >
            Verdadeiro quando há boleto a abrir (`GET .../pdf`) e o perfil da requisição pode vê-lo:
            veio do banco, está em aberto, e é de uma unidade que o perfil alcança.
        dataUltimaSincronizacao:
          type: string
          format: date-time
          readOnly: true
          description: Quando a situação foi conferida pela última vez com o banco.
        situacao:
          type: string
          readOnly: true
          enum: [PENDENTE, PAGO, INADIMPLENTE, CANCELADA]
          description: >
            Calculada no servidor: PAGO quando há `dataPagamento`; CANCELADA quando o banco
            informa cancelada ou expirada; INADIMPLENTE quando o vencimento passou sem
            pagamento; PENDENTE nos demais casos.
    CobrancaBancoPendente:
      type: object
      description: Cobrança emitida no banco que não virou cobrança no sistema.
      properties:
        idCondominio:
          type: integer
          format: int64
        codigoSolicitacao:
          type: string
        seuNumero:
          type: string
        dataVencimento:
          type: string
          format: date
        valor:
          type: number
          format: double
        motivo:
          type: string
          enum: [SEM_UNIDADE, UNIDADE_AMBIGUA, UNIDADE_ISENTA, COMPETENCIA_DUPLICADA]
          description: >
            `SEM_UNIDADE`: nenhuma unidade com o número do `seuNumero`. `UNIDADE_AMBIGUA`: o número
            existe em mais de um bloco. `UNIDADE_ISENTA`: a unidade está isenta (100%) mas o banco
            emitiu cobrança. `COMPETENCIA_DUPLICADA`: a unidade já tem outra cobrança nesse mês.
    DadosDePagamentoCobranca:
      type: object
      properties:
        pixCopiaCola:
          type: string
        linhaDigitavel:
          type: string
    RegistroDePagamento:
      type: object
      properties:
        dataPagamento:
          type: string
          format: date
          description: Ausente vale "hoje".
    ErroDeParametro:
      type: object
      properties:
        parametro:
          type: string
        mensagem:
          type: string
    ListaDeErros:
      type: object
      properties:
        erros:
          type: array
          items:
            $ref: "#/components/schemas/ErroDeParametro"
        quantidadeDeErros:
          type: integer
          format: int32
          readOnly: true
